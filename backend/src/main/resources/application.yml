spring:
  application:
    name: sentinelap-backend
  datasource:
    # Local dev / docker-compose set DB_URL/DB_USER/DB_PASSWORD directly (see
    # infra/docker-compose.yml). On Render, DatabaseUrlEnvironmentPostProcessor
    # derives these same three spring.datasource.* properties from a single
    # DATABASE_URL (the managed Postgres add-on's connection string) before
    # this file is even evaluated, so these defaults are only a local-dev fallback.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelap}
    username: ${DB_USER:sentinelap}
    password: ${DB_PASSWORD:sentinelap}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

sentinelap:
  seed-demo-data: ${SEED_DEMO_DATA:true}
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-please-32bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
  quickbooks:
    enabled: ${QBO_ENABLED:false}
    client-id: ${QBO_CLIENT_ID:}
    client-secret: ${QBO_CLIENT_SECRET:}
    redirect-uri: ${QBO_REDIRECT_URI:http://localhost:8080/api/integrations/quickbooks/callback}
    environment: ${QBO_ENVIRONMENT:sandbox}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
